# PSC Current Affairs — scheduled poster
# Posts ONE pending video from queue.json to Instagram Reels + YouTube Shorts
# on each run. Ten runs a day (IST times below, written in UTC).
# After a successful post, the queue entry is marked posted and the mp4
# is deleted, and those changes are committed back to the repo so the
# next run picks the next video. The daily queue commits also keep the
# scheduled workflow alive (GitHub switches scheduled workflows off
# after 60 days without a push).

name: Post next video

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 4 * * *"
    - cron: "30 5 * * *"
    - cron: "0 7 * * *"
    - cron: "30 8 * * *"
    - cron: "0 10 * * *"
    - cron: "30 11 * * *"
    - cron: "0 13 * * *"
    - cron: "30 14 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Post one specific video (slug), leave empty for next pending"
        required: false
        default: ""
      dry_run:
        description: "Validate tokens + video only, post nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests google-api-python-client google-auth google-auth-oauthlib

      - name: Post next video
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.slug }}" ]; then ARGS="$ARGS --slug ${{ inputs.slug }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python post.py $ARGS

      - name: Commit queue update (posted entry + deleted mp4)
        run: |
          git config user.name "psc-scheduler"
          git config user.email "psc-scheduler@users.noreply.github.com"
          git add queue.json queue/
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
          else
            git commit -m "Posted video — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
